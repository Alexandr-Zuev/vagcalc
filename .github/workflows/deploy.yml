name: Deploy to GitHub Pages

# Сборка и публикация на https://<user>.github.io/<repo>/ при пуше в main.
on:
  push:
    branches: [main]
  # Позволяет собрать и опубликовать вручную: Actions → Run workflow
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Не запускать новый деплой, пока предыдущий ещё в работе
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Явно ubuntu-24.04: метка ubuntu-latest мигрирует на Ubuntu 26
    # 19 октября 2026 и может принести неожиданные изменения
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Окружение
        run: |
          node -v
          npm -v

      - name: Установить зависимости
        run: npm ci

      # Типы и тесты — отдельными шагами: так при сбое сразу видно,
      # что именно упало, а не «exit code 1» на общем шаге
      - name: Проверить типы
        run: npm run typecheck

      - name: Тесты
        run: npm test

      - name: Собрать
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4