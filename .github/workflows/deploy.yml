name: Deploy to GitHub Pages

# Сборка и публикация на https://<user>.github.io/<repo>/ при пуше в main.
on:
  push:
    branches: [main]
  # Позволяет собрать и опубликовать вручную: Actions → Deploy to GitHub Pages → Run workflow
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Не запускать новый деплой, пока предыдущий ещё в работе
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      # Тесты геометрии и подбора — ломающие изменения не попадут в Pages
      - name: Проверить типы и тесты
        run: |
          npm run typecheck
          npm test

      - name: Собрать
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4